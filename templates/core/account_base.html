{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Account{% endblock %} — RailFlow</title>
<link rel="stylesheet" href="{% static 'css/site.css' %}"><link rel="stylesheet" href="{% static 'css/account.css' %}">
</head><body><header class="nav wrap"><a class="brand" href="{% url 'home' %}"><span class="brand-icon">↗</span> RailFlow</a>
<nav><a href="{% url 'home' %}">Home</a>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'my_bookings' %}">My bookings</a>{% endif %}</nav>
{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-cta" type="submit">Log out</button></form>{% else %}<a class="nav-cta" href="{% url 'login' %}">Sign in</a>{% endif %}</header>
<main class="account-container wrap">{% block content %}{% endblock %}</main></body></html>
